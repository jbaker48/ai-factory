<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<!--
  Design notes (one line per decision):
  - Read as an ops board for the one person running the factory: calm, ENERGY 1 / RHYTHM 2 / MOTION 1.
  - Warm paper neutrals, because the page stays open all day beside a terminal and pure white glares.
  - One accent (vermilion) means "needs you" and nothing else, so the eye goes there first.
  - Green and amber only carry review verdicts; they are status, not decoration.
  - System UI type, because this is a local tool that should read like the OS around it; mono only for ids, branches and commands you copy.
  - The stage track (Spec to Approve) is the motif: the legend shows each stage's model and every job sits on the same track.
  - No animation: the page polls every 2s, and movement on every poll would be noise.
  - Light and dark follow the OS, with a toggle, because there is no brand reason to force either.
-->
<style>
  :root {
    --bg: #f4f2ec; --surface: #fbfaf7; --sunk: #e9e6de; --line: #d8d3c8;
    --ink: #1f1e1b; --ink-2: #4f4c45; --ink-3: #686459;
    --accent: #a63a0c; --pass: #2c6435; --warn: #7f5200;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --surface: #201f1c; --sunk: #121110; --line: #36342f;
      --ink: #ecebe5; --ink-2: #bbb7ad; --ink-3: #9a968c;
      --accent: #f0895a; --pass: #86c48d; --warn: #e2b45c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --surface: #201f1c; --sunk: #121110; --line: #36342f;
    --ink: #ecebe5; --ink-2: #bbb7ad; --ink-3: #9a968c;
    --accent: #f0895a; --pass: #86c48d; --warn: #e2b45c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* Header */
  header { padding-top: 28px; padding-bottom: 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  #status { color: var(--ink-2); }
  #status.error { color: var(--accent); }
  .theme {
    margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; color: var(--ink-2); font-size: 13px;
  }
  .theme:hover { color: var(--ink); border-color: var(--ink-3); }
  .banner {
    margin: 0 0 16px; padding: 10px 14px; border-left: 3px solid var(--accent);
    background: var(--surface); color: var(--ink);
  }

  /* Quota */
  .meters { display: flex; flex-wrap: wrap; gap: 6px 28px; color: var(--ink-2); padding-bottom: 24px; }
  .meter { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .meter > span:first-child { white-space: nowrap; }
  .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink-2); }
  .bar i.hot { background: var(--warn); }
  .bar i.full { background: var(--accent); }

  /* Sections */
  section { padding-bottom: 36px; }
  h2 { margin: 0 0 12px; font-size: 15px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
  h2 .count { font-weight: 400; color: var(--ink-3); }
  .empty { color: var(--ink-2); padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .empty p { margin: 0 0 4px; }

  /* Needs you: the focal point */
  #needs h2 { color: var(--accent); }
  .need {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 16px 18px; margin-bottom: 12px;
  }
  .need .feature { font-size: 16px; font-weight: 600; margin: 2px 0 4px; }
  .need .why { margin: 0 0 12px; }
  .open-job {
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
  }
  .open-job:hover { text-decoration-color: currentColor; }
  .cmds { display: grid; gap: 6px; align-content: start; }
  .cmd { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .cmd code { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .copy {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    font-size: 12px; padding: 3px 10px; min-width: 64px; color: var(--ink-2);
  }
  .copy:hover { color: var(--ink); border-color: var(--ink-3); }

  /* The stage track, shared by the legend and every row */
  .grid { display: grid; grid-template-columns: minmax(0, 2.4fr) repeat(5, minmax(0, 1fr)); gap: 0 14px; }
  .legend { padding: 0 18px 8px; color: var(--ink-2); }
  .legend .stage { font-weight: 600; color: var(--ink); }
  .legend .model { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { height: 6px; border-radius: 3px; border: 1px solid var(--line); }
  .seg.done { background: var(--ink-3); border-color: var(--ink-3); }
  .seg.now { background: var(--ink); border-color: var(--ink); }
  .seg.stop { background: var(--accent); border-color: var(--accent); }
  .track-m { display: none; gap: 4px; }
  .track-m .seg { flex: 1; }
  .need .track-m { display: flex; max-width: 360px; }

  .row {
    width: 100%; text-align: left; cursor: pointer; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; margin-bottom: 8px;
  }
  .row:hover { border-color: var(--ink-3); }
  .row .feature { font-weight: 600; margin: 0 0 2px; }
  .row .meta { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .label { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
  .row .label .auto { color: var(--accent); }
  .cell { padding-top: 7px; min-width: 0; }
  .cell .under { margin-top: 8px; }
  /* Review chips borrow the Approve column, which has nothing under it. */
  .cell .under.wide { width: calc(200% + 14px); }

  .tasks { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .dot { width: 12px; height: 6px; border-radius: 2px; border: 1px solid var(--ink-3); }
  .dot.in_progress { background: var(--ink); border-color: var(--ink); }
  .dot.closed { background: var(--ink-3); border-color: var(--ink-3); }
  .dot.blocked { background: var(--accent); border-color: var(--accent); }
  .dot.fix { width: 6px; border-radius: 50%; }
  .tasks .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 4px; }

  .rounds { display: grid; gap: 4px; }
  .round { display: flex; gap: 3px; align-items: center; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--ink-3); width: 20px; flex: none; }
  .chip {
    flex: 1; min-width: 0; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 1px 0; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-3);
  }
  .chip.PASS { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 45%, transparent); }
  .chip.CHANGES { color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .chip.bad { color: var(--accent); border-color: var(--accent); }
  .usage { margin-top: 8px; color: var(--ink-3); font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .usage .flag { color: var(--accent); font-weight: 600; }

  /* Finished */
  .done-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .done-row {
    display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; grid-template-areas: "result feature meta";
    gap: 4px 16px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 10px 4px; cursor: pointer;
  }
  .done-row:hover { background: var(--surface); }
  .result { grid-area: result; font-size: 13px; color: var(--ink-2); }
  .done-row .when { grid-area: meta; }
  .result.merged { color: var(--pass); }
  .done-row .feature { grid-area: feature; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done-row .feature .mono { color: var(--ink-3); margin-right: 8px; }
  .more { margin-top: 10px; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  /* Spend */
  details summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
  .tables { display: flex; flex-wrap: wrap; gap: 8px 40px; overflow-x: auto; }
  table.spend { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin: 10px 0 4px; }
  .spend th, .spend td { padding: 4px 14px 4px 0; text-align: right; white-space: nowrap; }
  .spend th:first-child, .spend td:first-child { text-align: left; }
  .spend th { color: var(--ink-3); font-weight: 400; border-bottom: 1px solid var(--line); }
  .note { color: var(--ink-3); font-size: 13px; margin: 6px 0 0; }

  footer { padding-bottom: 40px; color: var(--ink-3); }
  footer .mono { display: inline-block; margin-right: 18px; }

  /* Drawer */
  dialog.drawer {
    margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(940px, 100vw); max-width: 100vw;
    padding: 0; border: 0; border-left: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  dialog.drawer[open] { display: grid; grid-template-rows: auto 1fr; }
  dialog.drawer::backdrop { background: rgb(20 18 15 / .45); }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head h3 { margin: 4px 56px 6px 0; font-size: 17px; font-weight: 650; line-height: 1.35; }
  .links a { color: var(--ink); margin-right: 14px; font-size: 13px; }
  .close {
    position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 8px;
    border: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink-2); font-size: 20px; line-height: 1;
  }
  .close:hover { color: var(--ink); border-color: var(--ink-3); }
  .d-body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; background: var(--bg); }
  .files .group { font-size: 12px; color: var(--ink-3); margin: 14px 8px 4px; }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none;
    border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  }
  .file:hover { background: var(--sunk); color: var(--ink); }
  .file.on { background: var(--surface); color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
  .file .rn { display: none; }
  .v { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); flex: none; }
  .v.good { background: var(--pass); border-color: var(--pass); }
  .v.warn { background: var(--warn); border-color: var(--warn); }
  .v.stop { background: var(--accent); border-color: var(--accent); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; display: block; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 16px; } .md h3, .md h4 { font-size: 14px; color: var(--ink-2); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--ink-3); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--ink-2); }
  .md a { color: var(--ink); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 4px; margin-bottom: 14px; border: 1px solid; }
  .verdict.good { color: var(--pass); }
  .verdict.warn { color: var(--warn); }
  .verdict.stop { color: var(--accent); }

  @media (max-width: 860px) {
    .wrap { padding: 0 16px; }
    .legend { display: none; }
    .row .grid { display: block; }
    .cell { display: none; }
    .cell.has-under { display: block; padding-top: 10px; }
    .cell > .seg { display: none; }
    .cell .under { margin-top: 0; }
    .track-m { display: flex; margin-top: 10px; }
    .need { grid-template-columns: 1fr; }
    .copy { min-height: 44px; min-width: 76px; }
    .theme { min-height: 44px; }
    .done-row { grid-template-columns: 1fr auto; grid-template-areas: "result meta" "feature feature"; padding: 12px 4px; }
    .done-row .feature { white-space: normal; }
    .cell .under.wide { width: auto; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; min-height: 44px; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
    .close { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<header class="wrap">
  <h1>Software factory</h1>
  <span id="status" class="mono">Connecting to the dashboard server…</span>
  <button class="theme" id="theme" type="button">Theme: auto</button>
</header>
<div class="wrap" id="banner"></div>
<div class="wrap" id="meters"></div>
<main class="wrap" id="main"><p class="muted">Reading factory/jobs…</p></main>
<footer class="wrap">
  <p>Commands, from Claude Code:</p>
  <span class="mono">/factory &lt;feature&gt;</span>
  <span class="mono">/factory add &lt;feature&gt;</span>
  <span class="mono">/factory next</span>
  <span class="mono">/factory autopilot [n]</span>
  <span class="mono">/factory review [&lt;job-id&gt;]</span>
  <span class="mono">/factory approve &lt;job-id&gt;</span>
  <span class="mono">/factory rework &lt;job-id&gt; &lt;note&gt;</span>
</footer>
<div id="live" class="mono" aria-live="polite" style="position:absolute;left:-9999px"></div>

<dialog class="drawer" id="drawer" aria-labelledby="d-title">
  <div class="d-head">
    <div class="mono muted" id="d-num"></div>
    <h3 id="d-title"></h3>
    <div class="mono faint" id="d-branch"></div>
    <div class="links" id="d-links"></div>
    <button class="close" id="d-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="d-body">
    <nav class="files" id="d-files" aria-label="Job files"></nav>
    <article class="doc"><div class="md" id="d-doc"></div></article>
  </div>
</dialog>

<script>
const POLL_MS = 2000
// `roles` are factory/models.json keys; the legend shows their models.
const TRACK = [
  { key: 'spec', label: 'Spec', roles: ['spec-writer'] },
  { key: 'plan', label: 'Plan', roles: ['planner'] },
  { key: 'build', label: 'Build', roles: ['builder', 'builder-escalation'] },
  { key: 'review', label: 'Review', roles: ['reviewer-security', 'reviewer-code', 'reviewer-ux', 'reviewer-ui', 'reviewer-adversarial'] },
  { key: 'approve', label: 'Approve', roles: ['approver'] },
]
const STAGES = ['spec', 'plan', 'build', 'review', 'approve', 'autopilot', 'merged', 'needs-human', 'resubmitted', 'dropped']
const REVIEWERS = [['security', 'sec'], ['code', 'code'], ['ux', 'ux'], ['ui', 'ui'], ['adversarial', 'adv']]
// Where on the track each situation stopped the job, and what it means.
const SITUATIONS = {
  'plan-blocked': ['plan', 'The planner could not plan the spec as written.'],
  'build-blocked': ['build', 'A builder reported BLOCKED, even after escalating to a bigger model.'],
  'rounds-exhausted': ['review', 'Review rounds ran out with changes still outstanding.'],
  'escalated': ['approve', 'Every review passed, but the approver sent it to you.'],
  'merge-blocked': ['approve', 'Approved, but the merge failed or conflicts with the base.'],
}

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let data = null
let failed = false
let showAllDone = false
let openJobId = null
let openPath = null
let openText = null
const painted = {}

// Only touch the DOM when a section's html changed, so focus and scroll stay put.
function paint(id, html) {
  if (painted[id] === html) return
  painted[id] = html
  $(id).innerHTML = html
}

// ---- Theme ---------------------------------------------------------------

const THEMES = ['auto', 'light', 'dark']
function storeGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function storeSet(k, v) { try { localStorage.setItem(k, v) } catch { /* private mode */ } }
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme
  else document.documentElement.dataset.theme = t
  $('theme').textContent = `Theme: ${t}`
}
let theme = THEMES.includes(storeGet('factory-theme')) ? storeGet('factory-theme') : 'auto'
applyTheme(theme)
$('theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]
  storeSet('factory-theme', theme)
  applyTheme(theme)
})

// ---- Usage ---------------------------------------------------------------

const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0)
const tokens = (r) => num(r.input) + num(r.output) // input already includes cached
const sum = (xs) => xs.reduce((a, b) => a + b, 0)
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b)
  const m = s.length
  return m % 2 ? s[(m - 1) / 2] : (s[m / 2 - 1] + s[m / 2]) / 2
}
function fmtTok(n) {
  if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`
  if (n >= 1e3) return `${Math.round(n / 1e3)}k`
  return String(Math.round(n))
}

function stageTotals(records) {
  const by = {}
  for (const r of records) by[r.stage || '?'] = (by[r.stage || '?'] || 0) + tokens(r)
  return by
}

// Same rule as factory/bin/usage-summary: a stage total at least 2x the median
// of that stage over merged or dropped jobs, when at least 3 such jobs have it.
function runawayFlags(jobs) {
  const buckets = {}
  for (const j of jobs) {
    if (j.stage !== 'merged' && j.stage !== 'dropped') continue
    for (const [k, v] of Object.entries(stageTotals(j.usage))) (buckets[k] ||= []).push(v)
  }
  const flags = {}
  for (const j of jobs) {
    flags[j.id] = Object.entries(stageTotals(j.usage)).sort().flatMap(([k, v]) => {
      const b = buckets[k]
      if (!b || b.length < 3) return []
      const med = median(b)
      return med > 0 && v >= 2 * med ? [{ stage: k, ratio: v / med }] : []
    })
  }
  return flags
}

// Newest record (by ts) per quota window; each carries {quota, ts}.
function newestQuotas(jobs) {
  const all = jobs.flatMap((j) => j.usage.filter((r) => r.quota && typeof r.quota === 'object'))
  all.sort((a, b) => String(a.ts).localeCompare(String(b.ts)))
  const byWindow = new Map()
  for (const r of all) byWindow.set(r.quota.window || 'quota', { quota: r.quota, ts: r.ts })
  return [...byWindow.values()]
}

function groupSpend(jobs, keyOf) {
  const g = {}
  for (const j of jobs) {
    for (const r of j.usage) {
      const e = (g[keyOf(r) || '?'] ||= { tokens: 0, runs: 0, jobs: new Set() })
      e.tokens += tokens(r)
      e.runs++
      e.jobs.add(j.id)
    }
  }
  return Object.entries(g).sort().map(([k, e]) => ({ key: k, tokens: e.tokens, runs: e.runs, jobs: e.jobs.size }))
}

function quotaMeter({ quota: q, ts }) {
  const pct = typeof q.after === 'number' ? Math.round(q.after) : null
  const reset = typeof q.resets_at === 'number' ? new Date(q.resets_at * 1000).toLocaleString() : 'unknown'
  const cls = pct === null ? '' : pct >= 90 ? 'full' : pct >= 70 ? 'hot' : ''
  return `<span class="meter"><span>Codex ${esc(q.window || 'quota')}</span>
    <span class="bar" role="img" aria-label="${pct ?? 'unknown'} percent used"><i class="${cls}" style="width:${Math.min(100, pct ?? 0)}%"></i></span>
    <span class="mono">${pct === null ? '?' : pct}% used, resets ${esc(reset)}</span></span>`
}

function spendTable(title, rows) {
  if (!rows.length) return ''
  return `<table class="spend"><tr><th>${title}</th><th>tokens</th><th>runs</th><th>jobs</th><th>per job</th></tr>${rows.map((r) =>
    `<tr><td>${esc(r.key)}</td><td>${fmtTok(r.tokens)}</td><td>${r.runs}</td><td>${r.jobs}</td><td>${fmtTok(r.tokens / r.jobs)}</td></tr>`).join('')}</table>`
}

function usageLine(job, flags) {
  const u = job.usage
  if (!u.length) return ''
  const inp = sum(u.map((r) => num(r.input)))
  const cached = sum(u.map((r) => num(r.cached)))
  const out = sum(u.map((r) => num(r.output)))
  const fl = (flags[job.id] || []).map((f) => `<span class="flag">${esc(f.stage)} at ${f.ratio.toFixed(1)}× the median</span>`).join(' ')
  return `<div class="usage">${fmtTok(inp)} in (${inp > 0 ? Math.round(cached / inp * 100) : 0}% cached), ${fmtTok(out)} out, ${u.length} run${u.length === 1 ? '' : 's'}${fl ? `<br>${fl}` : ''}</div>`
}

// Drawer view of usage.jsonl, as markdown.
function usageMarkdown(records) {
  const cell = (v) => (v === null || v === undefined ? '' : String(v)).replace(/\|/g, '/')
  const delta = (q) => (q && typeof q.after === 'number' && typeof q.before === 'number'
    ? `${q.after - q.before >= 0 ? '+' : ''}${+(q.after - q.before).toFixed(2)}%` : '')
  const rows = records.map((r) => `| ${cell(r.stage)} | ${cell(r.role)} | ${cell(r.model)} | ${cell(r.round)} | ${fmtTok(tokens(r))} | ${cell(r.duration_s)}s | ${cell(r.exit)} | ${delta(r.quota)} |`)
  return `# Usage\n\n${records.length} runs, ${fmtTok(sum(records.map(tokens)))} tokens (input + output).\n\n` +
    `| stage | role | model | round | tokens | time | exit | quota change |\n|---|---|---|---|---|---|---|---|\n${rows.join('\n')}\n\n` +
    `Quota change is approximate (account-wide meter): it also moves when anything else uses the account.`
}

// ---- Board ---------------------------------------------------------------

const shortModel = (m) => String(m).replace(/^gpt-[\d.]+-/, '')
function modelsFor(stage) {
  return [...new Set(stage.roles.map((r) => data.models[r]?.model).filter(Boolean).map(shortModel))].join(', ')
}

// Where the job sits on the track: index of the current stage, and whether it stopped there.
function position(job) {
  const i = TRACK.findIndex((s) => s.key === job.stage)
  if (i >= 0) return { at: i, stop: false }
  const sit = SITUATIONS[job.situation]
  if (sit) return { at: TRACK.findIndex((s) => s.key === sit[0]), stop: true }
  return { at: -1, stop: false }
}

function segClass(i, pos) {
  if (pos.at < 0) return 'seg'
  if (i < pos.at) return 'seg done'
  if (i === pos.at) return pos.stop ? 'seg stop' : 'seg now'
  return 'seg'
}

function chips(n, verdicts) {
  const cells = REVIEWERS.map(([k, short]) => {
    const v = verdicts?.[k] ?? 'pending'
    const cls = v === 'PASS' || v === 'CHANGES' ? v : v === 'pending' ? '' : 'bad'
    const label = v === 'missing' || v === 'invalid' ? `${short}?` : short
    return `<span class="chip ${cls}" title="${k}: ${esc(v)}">${label}</span>`
  }).join('')
  return `<div class="round"><span class="r">R${n}</span>${cells}</div>`
}

function rounds(job) {
  const rows = (job.past || []).map((v, i) => chips(i + 1, v))
  if (job.round > 0) rows.push(chips(job.round, job.reviews))
  return rows.length ? `<div class="rounds">${rows.join('')}</div>` : ''
}

function taskDots(tasks) {
  if (!tasks || !tasks.length) return ''
  const done = tasks.filter((t) => t.status === 'closed').length
  const dots = tasks.map((t) => {
    const fix = /^(Fix |Rework |Autopilot rework)/.test(t.title) ? 'fix' : ''
    const tip = `${t.id}: ${t.title} (${t.status}${t.model ? ', ' + t.model : ''})`
    return `<span class="dot ${esc(t.status)} ${fix}" title="${esc(tip)}"></span>`
  }).join('')
  return `<div class="tasks">${dots}<span class="n">${done}/${tasks.length}</span></div>`
}

function stageLabel(job) {
  if (job.stage === 'autopilot') return `<span class="auto">Autopilot is deciding.</span> ${esc(SITUATIONS[job.situation]?.[1] || '')}`
  if (job.stage === 'resubmitted') return 'Resubmitted with your decision; waiting for the queue to resume it.'
  const s = TRACK.find((t) => t.key === job.stage)
  const who = s ? modelsFor(s) : ''
  return `${esc(s?.label || job.stage)}${who ? ` <span class="faint">on ${esc(who)}</span>` : ''}${job.autopilot ? ' <span class="auto">· autopilot job</span>' : ''}`
}

// The current stage's detail sits under its own column of the track.
function underFor(job, key) {
  if (key === 'build') return taskDots(job.tasks)
  if (key === 'review') return rounds(job)
  return ''
}

function runningRow(job, flags) {
  const pos = position(job)
  const cells = TRACK.map((s, i) => {
    const under = underFor(job, s.key)
    return `<div class="cell ${under ? 'has-under' : ''}"><div class="${segClass(i, pos)}" title="${s.label}"></div>${under ? `<div class="under ${s.key === 'review' ? 'wide' : ''}">${under}</div>` : ''}</div>`
  }).join('')
  const mobile = TRACK.map((s, i) => `<div class="${segClass(i, pos)}"></div>`).join('')
  return `<button class="row" type="button" data-job="${esc(job.id)}">
    <div class="grid">
      <div>
        <p class="feature">${esc(job.feature)}</p>
        <div class="meta mono">${esc(job.id)}${job.bead ? ` · ${esc(job.bead)}` : ''}</div>
        <div class="label">${stageLabel(job)}</div>
        <div class="track-m" aria-hidden="true">${mobile}</div>
        ${usageLine(job, flags)}
      </div>
      ${cells}
    </div>
  </button>`
}

function needCard(job) {
  const sit = SITUATIONS[job.situation]
  const pos = position(job)
  const track = TRACK.map((s, i) => `<div class="${segClass(i, pos)}" title="${s.label}"></div>`).join('')
  const cmds = [`/factory review ${job.id}`, `/factory approve ${job.id}`, `/factory rework ${job.id} <note>`, `/factory autopilot ${job.id}`]
  return `<article class="need">
    <div>
      <div class="mono faint">${esc(job.id)}${job.bead ? ` · ${esc(job.bead)}` : ''}</div>
      <p class="feature"><button class="open-job" type="button" data-job="${esc(job.id)}">${esc(job.feature)}</button></p>
      <p class="why muted">${esc(sit ? sit[1] : 'Waiting for your decision.')}</p>
      <div class="track-m" aria-hidden="true">${track}</div>
    </div>
    <div class="cmds" aria-label="Commands for ${esc(job.id)}">
      ${cmds.map((c) => `<div class="cmd"><code>${esc(c)}</code><button class="copy" type="button" data-copy="${esc(c)}">Copy</button></div>`).join('')}
    </div>
  </article>`
}

function doneRow(job) {
  const rounds = job.round ? `${job.round} round${job.round === 1 ? '' : 's'}` : ''
  const tok = job.usage.length ? `${fmtTok(sum(job.usage.map(tokens)))} tokens` : ''
  const when = job.updated ? new Date(job.updated).toLocaleDateString() : ''
  return `<li><button class="done-row" type="button" data-job="${esc(job.id)}">
    <span class="result ${job.stage}">${job.stage === 'merged' ? 'Merged' : 'Dropped'}</span>
    <span class="when mono faint">${[rounds, tok, when].filter(Boolean).map(esc).join(' · ')}</span>
    <span class="feature"><span class="mono">${esc(job.id)}</span>${esc(job.feature)}</span>
  </button></li>`
}

function render() {
  const jobs = data.jobs
  const newest = (a, b) => String(b.updated || '').localeCompare(String(a.updated || ''))
  const problems = [...data.problems]
  for (const j of jobs) if (!STAGES.includes(j.stage)) problems.push(`Job ${j.id} has unknown stage "${j.stage}"`)
  const banner = (failed ? ['Lost the dashboard server. Is factory/bin/dashboard still running? Showing what was last loaded.'] : []).concat(problems)
  paint('banner', banner.map((p) => `<div class="banner">${esc(p)}</div>`).join(''))

  const withUsage = jobs.filter((j) => j.usage.length)
  const quotas = newestQuotas(withUsage)
  paint('meters', `<div class="meters">${quotas.map(quotaMeter).join('') || '<span>Codex quota: no data yet</span>'}<span>Claude: tokens only</span></div>`)

  if (!jobs.length) {
    paint('main', `<div class="empty"><p>No jobs yet.</p><p class="faint">Start one from Claude Code with <span class="mono">/factory &lt;feature&gt;</span>; it shows up here within a couple of seconds.</p></div>`)
    return
  }
  const flags = runawayFlags(jobs)
  const needs = jobs.filter((j) => j.stage === 'needs-human').sort(newest)
  const running = jobs.filter((j) => !['needs-human', 'merged', 'dropped'].includes(j.stage) && STAGES.includes(j.stage)).sort(newest)
  const done = jobs.filter((j) => j.stage === 'merged' || j.stage === 'dropped').sort(newest)
  const shown = showAllDone ? done : done.slice(0, 10)
  const total = sum(withUsage.map((j) => sum(j.usage.map(tokens))))
  const spendOpen = document.querySelector('#main details')?.open ? 'open' : ''

  const legend = `<div class="grid legend"><div>Job</div>${TRACK.map((s) =>
    `<div><span class="stage">${s.label}</span><span class="model" title="${esc(modelsFor(s))}">${esc(modelsFor(s) || s.roles[0])}</span></div>`).join('')}</div>`

  paint('main', [
    needs.length ? `<section id="needs" aria-labelledby="h-needs"><h2 id="h-needs">Needs you <span class="count">${needs.length}</span></h2>${needs.map(needCard).join('')}</section>` : '',
    `<section aria-labelledby="h-run"><h2 id="h-run">In progress <span class="count">${running.length}</span></h2>${legend}${
      running.map((j) => runningRow(j, flags)).join('') || '<div class="empty">Nothing running. <span class="mono">/factory next</span> picks up the next ready bead.</div>'}</section>`,
    done.length ? `<section aria-labelledby="h-done"><h2 id="h-done">Finished <span class="count">${done.length}</span></h2><ul class="done-list">${shown.map(doneRow).join('')}</ul>${
      done.length > 10 ? `<button class="more" type="button" data-more>${showAllDone ? 'Show the 10 newest' : `Show all ${done.length}`}</button>` : ''}</section>` : '',
    withUsage.length ? `<section><details ${spendOpen}><summary>Spend: ${fmtTok(total)} tokens over ${withUsage.length} job${withUsage.length === 1 ? '' : 's'}</summary>
      <div class="tables">${spendTable('role', groupSpend(withUsage, (r) => r.role))}${spendTable('model', groupSpend(withUsage, (r) => r.model))}</div>
      <p class="note">Tokens are input + output. Spend is information only; nothing is stopped on it.</p></details></section>` : '',
  ].join(''))
}

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    data = await res.json()
    failed = false
    $('status').className = 'mono'
    $('status').textContent = `land: ${data.land} · ${data.jobs.length} job${data.jobs.length === 1 ? '' : 's'} · updated ${new Date().toLocaleTimeString()}`
  } catch (err) {
    failed = true
    $('status').className = 'mono error'
    $('status').textContent = `Can't reach the server (${err.message})`
    if (!data) {
      paint('main', `<div class="empty"><p>Can't reach the dashboard server.</p><p class="faint">Start it with <span class="mono">factory/bin/dashboard</span> and reload this page.</p></div>`)
      return
    }
  }
  render()
  if (openJobId) refreshDrawer().catch(() => {})
}

// ---- Drawer --------------------------------------------------------------

async function api(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res
}

function fileRank(path) {
  const order = ['spec.md', 'plan.json', 'build.md', 'decision.md', 'retro.md', 'usage.jsonl']
  if (order.includes(path)) return [0, order.indexOf(path), path]
  if (path.startsWith('build/')) return [3, 0, path]
  const round = path.match(/^round-(\d+)\/review-(\w+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + REVIEWERS.findIndex(([k]) => k === round[2]), path]
  return [1, 0, path] // rework-<k>.md, autopilot-<k>.md, human-<k>.md and anything else
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|APPROVE|MERGE|STATUS:\s*(READY|DONE))$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|REWORK|RESPEC)$/.test(first)) return 'warn'
  if (/^(ESCALATE|PARK|STATUS:\s*BLOCKED)$/.test(first)) return 'stop'
  return null
}

// plan.json: show its status as the verdict line, then the tasks as markdown.
function planText(json) {
  let plan
  try { plan = JSON.parse(json) } catch { return 'STATUS: BLOCKED\n\nplan.json is not valid JSON.' }
  const tasks = (plan.tasks || []).map((t) =>
    `${t.key}. **${t.title}**${t.final ? ' (final)' : ''}: ${t.description} Covers ${(t.covers || []).join(', ') || 'nothing listed'}.` +
    (t.depends_on?.length ? ` After ${t.depends_on.join(', ')}.` : ''))
  return `STATUS: ${plan.status}\n\n# Plan\n\n${tasks.map((t) => `- ${t}`).join('\n')}` +
    (plan.blocked ? `\n\n## Blocked\n\n${plan.blocked}` : '')
}

async function refreshDrawer() {
  const job = data?.jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''}${job.autopilot ? ' · autopilot' : ''}`
  $('d-title').textContent = job.feature
  $('d-branch').textContent = `${job.bead ? job.bead + ' · ' : ''}${job.branch || ''}`
  paint('d-links', [['Pull request', job.pr], ['Retro PR', job.retro_pr], ['Factory retro PR', job.retro_factory_pr]]
    .filter(([, u]) => /^https?:\/\//.test(u || ''))
    .map(([label, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`).join(''))

  const q = `job=${encodeURIComponent(job.id)}`
  const files = (await (await api(`/api/files?${q}`)).json())
    .sort((a, b) => {
      const [x, y] = [fileRank(a.path), fileRank(b.path)]
      return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
    })
  if (!openPath || !files.some((f) => f.path === openPath)) openPath = files[0]?.path || null

  let group = null
  paint('d-files', files.map(({ path: f, first }) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ').replace('build', 'Tasks') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : f.startsWith('build/') ? esc(f.slice(6).replace(/\.md$/, '')) : esc(f)
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" type="button" data-file="${esc(f)}" ${f === openPath ? 'aria-current="true"' : ''}>
      <span class="v ${tone(first) || ''}"></span>${name}</button>`
  }).join('') || '<p class="note">No files yet.</p>')

  let text = null
  if (openPath) {
    const raw = await (await api(`/api/file?${q}&path=${encodeURIComponent(openPath)}`)).text()
    text = openPath === 'usage.jsonl' ? usageMarkdown(raw.split('\n').flatMap((l) => { try { return [JSON.parse(l)] } catch { return [] } }))
      : openPath === 'plan.json' ? planText(raw) : raw
  }
  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">The spec-writer hasn’t written anything yet.</p>' : markdown(text)
  }
}

let opener = null
async function openDrawer(id, from) {
  openJobId = id
  openPath = null
  openText = undefined
  painted['d-files'] = painted['d-links'] = undefined
  opener = from
  $('d-doc').innerHTML = '<p class="note">Loading…</p>'
  if (!$('drawer').open) $('drawer').showModal()
  $('d-close').focus()
  try { await refreshDrawer() } catch (err) { $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>` }
}

$('drawer').addEventListener('close', () => {
  openJobId = null
  const id = opener?.dataset.job
  const again = id && document.querySelector(`[data-job="${CSS.escape(id)}"]`)
  ;(again || opener)?.focus()
})
$('d-close').addEventListener('click', () => $('drawer').close())
$('drawer').addEventListener('click', (e) => { if (e.target === $('drawer')) $('drawer').close() })

document.addEventListener('click', async (e) => {
  const copyEl = e.target.closest('[data-copy]')
  if (copyEl) {
    try {
      await navigator.clipboard.writeText(copyEl.dataset.copy)
      copyEl.textContent = 'Copied'
      $('live').textContent = `Copied ${copyEl.dataset.copy}`
    } catch {
      copyEl.textContent = 'Select it'
    }
    setTimeout(() => { copyEl.textContent = 'Copy' }, 1500)
    return
  }
  if (e.target.closest('[data-more]')) { showAllDone = !showAllDone; render(); return }
  const jobEl = e.target.closest('[data-job]')
  if (jobEl) return openDrawer(jobEl.dataset.job, jobEl)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    try { await refreshDrawer() } catch (err) { $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>` }
  }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) { html += `<div class="verdict ${t}">${esc(first)}</div>`; i = 1 }

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
setInterval(poll, POLL_MS)
